<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REZA GROOTZ — ULTRA LUXURY PANEL</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-screen">
            <div class="login-container">
                <div class="login-logo">
                    <span class="logo-icon">👑</span>
                    <h1>REZA GROOTZ</h1>
                    <p class="subtitle">ULTRA LUXURY CONFIG PANEL</p>
                </div>
                <div class="login-box">
                    <div class="gold-line"></div>
                    <h2>ورود به پنل</h2>
                    <form id="loginForm">
                        <div class="input-group">
                            <input type="password" id="passwordInput" placeholder="رمز عبور" />
                            <span class="input-icon">🔑</span>
                        </div>
                        <button type="submit" class="btn-gold">ورود →</button>
                    </form>
                    <p class="login-error" id="loginError"></p>
                </div>
                <div class="login-footer">
                    <p>© 2026 REZA GROOTZ — تمام حقوق محفوظ است</p>
                </div>
            </div>
        </div>

        <!-- Main Panel -->
        <div id="panelScreen" class="panel-screen" style="display:none;">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-brand">
                    <span>👑</span>
                    <span>REZA GROOTZ</span>
                </div>
                <nav class="sidebar-nav">
                    <a href="#dashboard" class="active" data-section="dashboard">
                        <span>📊</span> داشبورد
                    </a>
                    <a href="#configs" data-section="configs">
                        <span>⚡</span> کانفیگ‌ها
                    </a>
                    <a href="#users" data-section="users">
                        <span>👥</span> کاربران
                    </a>
                    <a href="#logs" data-section="logs">
                        <span>📋</span> لاگ‌ها
                    </a>
                    <a href="#settings" data-section="settings">
                        <span>⚙️</span> تنظیمات
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <button id="logoutBtn" class="btn-logout">🚪 خروج</button>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <header class="main-header">
                    <h2 id="sectionTitle">داشبورد</h2>
                    <div class="header-actions">
                        <span class="user-badge">👑 ادمین</span>
                        <button id="refreshBtn" class="btn-icon">🔄</button>
                    </div>
                </header>

                <div id="contentArea">
                    <!-- Dashboard -->
                    <section id="dashboardSection" class="content-section active">
                        <div class="stats-grid">
                            <div class="stat-card gold">
                                <span class="stat-icon">📦</span>
                                <div class="stat-info">
                                    <span class="stat-value" id="totalConfigs">0</span>
                                    <span class="stat-label">کانفیگ‌ها</span>
                                </div>
                            </div>
                            <div class="stat-card gold">
                                <span class="stat-icon">👥</span>
                                <div class="stat-info">
                                    <span class="stat-value" id="totalUsers">0</span>
                                    <span class="stat-label">کاربران</span>
                                </div>
                            </div>
                            <div class="stat-card gold">
                                <span class="stat-icon">📊</span>
                                <div class="stat-info">
                                    <span class="stat-value" id="totalTraffic">0</span>
                                    <span class="stat-label">ترافیک (GB)</span>
                                </div>
                            </div>
                            <div class="stat-card gold">
                                <span class="stat-icon">📋</span>
                                <div class="stat-info">
                                    <span class="stat-value" id="totalLogs">0</span>
                                    <span class="stat-label">لاگ‌ها</span>
                                </div>
                            </div>
                        </div>
                        <div class="quick-actions">
                            <button class="btn-gold btn-lg" id="quickAddConfig">➕ کانفیگ جدید</button>
                            <button class="btn-gold btn-lg" id="quickAddUser">👤 کاربر جدید</button>
                        </div>
                    </section>

                    <!-- Configs -->
                    <section id="configsSection" class="content-section">
                        <div class="section-toolbar">
                            <button class="btn-gold" id="addConfigBtn">➕ کانفیگ جدید</button>
                            <div class="search-box">
                                <input type="text" id="configSearch" placeholder="جستجوی کانفیگ..." />
                            </div>
                        </div>
                        <div id="configsList" class="configs-grid"></div>
                    </section>

                    <!-- Users -->
                    <section id="usersSection" class="content-section">
                        <div class="section-toolbar">
                            <button class="btn-gold" id="addUserBtn">👤 کاربر جدید</button>
                            <div class="search-box">
                                <input type="text" id="userSearch" placeholder="جستجوی کاربر..." />
                            </div>
                        </div>
                        <div id="usersList" class="users-grid"></div>
                    </section>

                    <!-- Logs -->
                    <section id="logsSection" class="content-section">
                        <div class="section-toolbar">
                            <button class="btn-gold" id="clearLogsBtn">🗑️ پاکسازی لاگ‌ها</button>
                        </div>
                        <div id="logsList" class="logs-table-container"></div>
                    </section>

                    <!-- Settings -->
                    <section id="settingsSection" class="content-section">
                        <div class="settings-panel">
                            <h3>تنظیمات پنل</h3>
                            <div class="settings-group">
                                <label>API Key</label>
                                <div class="settings-row">
                                    <input type="text" id="apiKeyDisplay" readonly />
                                    <button class="btn-gold btn-sm" id="regenerateApiKey">🔄 بازنشانی</button>
                                </div>
                            </div>
                            <div class="settings-group">
                                <label>ربات تلگرام</label>
                                <div class="settings-row">
                                    <input type="text" id="telegramBotToken" placeholder="توکن ربات" />
                                    <button class="btn-gold btn-sm" id="connectTelegram">اتصال</button>
                                </div>
                            </div>
                            <div class="settings-group">
                                <label>رمز عبور</label>
                                <div class="settings-row">
                                    <input type="password" id="changePassword" placeholder="رمز جدید" />
                                    <button class="btn-gold btn-sm" id="updatePassword">تغییر رمز</button>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div id="configModal" class="modal" style="display:none;">
        <div class="modal-content gold-border">
            <span class="modal-close">&times;</span>
            <h3>کانفیگ جدید</h3>
            <form id="configForm">
                <div class="form-group">
                    <label>نام کانفیگ</label>
                    <input type="text" id="configName" placeholder="مثال: سرور طلایی" />
                </div>
                <div class="form-group">
                    <label>نوع</label>
                    <select id="configType">
                        <option value="vless">VLESS</option>
                        <option value="reality">Reality</option>
                        <option value="trojan">Trojan</option>
                        <option value="stormdns">StormDNS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>سرور</label>
                    <input type="text" id="configServer" placeholder="example.com" />
                </div>
                <div class="form-group">
                    <label>پورت</label>
                    <input type="number" id="configPort" placeholder="443" />
                </div>
                <div class="form-group">
                    <label>کاربر</label>
                    <select id="configUser"></select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary modal-close-btn">انصراف</button>
                    <button type="submit" class="btn-gold">ذخیره</button>
                </div>
            </form>
        </div>
    </div>

    <div id="userModal" class="modal" style="display:none;">
        <div class="modal-content gold-border">
            <span class="modal-close">&times;</span>
            <h3>کاربر جدید</h3>
            <form id="userForm">
                <div class="form-group">
                    <label>نام کاربری</label>
                    <input type="text" id="userUsername" placeholder="username" />
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="userPassword" placeholder="••••••••" />
                </div>
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="userEmail" placeholder="email@example.com" />
                </div>
                <div class="form-group">
                    <label>نقش</label>
                    <select id="userRole">
                        <option value="user">کاربر</option>
                        <option value="admin">ادمین</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary modal-close-btn">انصراف</button>
                    <button type="submit" class="btn-gold">ذخیره</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
                              </html>
